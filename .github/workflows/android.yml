# 3.17: APK для Android (buildozer) -> релиз «android-latest»:
#   https://github.com/AlotMeMa/sabletooth-farm/releases/tag/android-latest
# Запускается сам после push в main (если менялись код, картинки или mobile/), и вручную: Actions -> android -> Run workflow.
name: android

on:
  push:
    branches: [main, mobile]
    paths:
      - "farmgame/**"
      - "assets/**"
      - "mobile/**"
      - "devtools/bake_sprites.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pygame-ce
        run: pip install pygame-ce
      - name: Тесты
        run: python -m unittest discover -s tests -t .
      - name: Картинки под телефон
        run: python devtools/bake_sprites.py build/baked
      - name: Иконки
        run: python mobile/build.py icons build/icons --baked build/baked
      - uses: actions/upload-artifact@v4
        with:
          name: baked
          path: |
            build/baked
            build/icons
          retention-days: 7

  android:
    needs: bake
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: baked
          path: build
      - name: Пакеты для сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer "cython<3.0" "setuptools<71"
      - name: python-for-android (с починкой рецепта pygame)
        run: |
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android build/p4a
          git -C build/p4a log --oneline -1
          python mobile/patch_p4a.py build/p4a
      - name: Подготовка
        run: |
          python mobile/build.py stage android build/android_src --baked build/baked --p4a build/p4a
          cp build/icons/icon.png build/icons/presplash.png build/android_src/
          mkdir -p ~/.android
          cp mobile/android/debug.keystore ~/.android/debug.keystore
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-home-${{ hashFiles('mobile/android/buildozer.spec') }}
      - uses: actions/cache@v4
        with:
          path: build/android_src/.buildozer
          key: buildozer-app-${{ hashFiles('mobile/android/buildozer.spec', 'mobile/patch_p4a.py') }}
      - name: buildozer android debug
        working-directory: build/android_src
        run: |
          buildozer -v android debug > ../buildozer.log 2>&1 < /dev/null || { tail -n 400 ../buildozer.log; exit 1; }
          tail -n 40 ../buildozer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildozer-log
          path: build/buildozer.log
          retention-days: 7
      - name: APK
        run: |
          ls -la build/android_src/bin
          cp build/android_src/bin/*.apk build/vesyolaya-ferma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/vesyolaya-ferma.apk
          retention-days: 14
      - name: Релиз android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest build/vesyolaya-ferma.apk --prerelease \
            --title "Весёлая ферма для Android (последняя сборка)" \
            --notes "Собрано автоматически из $(git rev-parse --short HEAD). Скачай APK на телефон и открой его (Android попросит разрешить установку из этого источника)."
